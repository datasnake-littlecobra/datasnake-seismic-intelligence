name: Data Pipeline

# Runs the full bronze -> silver -> gold -> replay pipeline and writes
# classified events into Supabase. On-demand only for now (Actions tab ->
# "Run workflow") — a prior run on every push hit a 45-minute timeout on the
# bronze step with the download behavior still not understood (see
# docs/MODULE2_ARCHITECTURE.md's troubleshooting log), so this is
# deliberately not automatic again until a run actually completes cleanly.
# Revisit re-enabling push-triggering once that's confirmed.
#
# GitHub-hosted runners have normal outbound internet access, unlike the
# dev sandbox this pipeline was originally built in — that's the whole
# reason this runs here instead of requiring a local machine.

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: "Which dataset(s) to run"
        required: false
        default: "both"
        type: choice
        options: ["both", "stead", "instance"]

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false # never cancel a run mid-write to the database

jobs:
  test:
    uses: ./.github/workflows/test.yml

  run-pipeline:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20 # shorter now the sample size is tiny (see config_vibration.yaml) —
                         # a run taking anywhere near this long is itself a signal something's wrong
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_POOLER_URL: ${{ secrets.DATABASE_POOLER_URL }}
    strategy:
      matrix:
        dataset: ${{ (github.event.inputs.dataset == 'stead' && fromJSON('["stead"]')) || (github.event.inputs.dataset == 'instance' && fromJSON('["instance"]')) || fromJSON('["stead", "instance"]') }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Disk space before bronze ingest
        run: df -h /

      - name: Bronze — pull sample via SeisBench
        timeout-minutes: 10 # fail fast and clearly rather than repeat the earlier unexplained 45-min hang
        run: python src/02_ml_pipeline/bronze_ingest.py --dataset ${{ matrix.dataset }}

      - name: Disk space after bronze ingest
        if: always()
        run: df -h /

      - name: Silver — filter, normalize, window
        run: python src/02_ml_pipeline/silver_clean.py --dataset ${{ matrix.dataset }}

      - name: Gold — label, split
        run: python src/02_ml_pipeline/gold_label_split.py --dataset ${{ matrix.dataset }}

      - name: Replay — classify + upsert into Supabase
        run: python src/02_ml_pipeline/replay_pipeline.py --dataset ${{ matrix.dataset }}

      - name: Upload manifests + gold-layer metadata as build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output-${{ matrix.dataset }}
          path: |
            data/module2_vibration/manifests/
            data/module2_vibration/gold/*.csv
          retention-days: 30
