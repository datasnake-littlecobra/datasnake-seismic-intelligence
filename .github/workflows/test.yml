name: Tests

on:
  pull_request:
    branches: [main]
  workflow_call: {} # pipeline.yml calls this on every push to main, instead of
                     # this workflow also listening for push directly — avoids
                     # two runs of the same tests racing/cancelling each other

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-ml.txt

      - name: Install dependencies
        run: pip install -r requirements-ml.txt pytest

      - name: Run pipeline tests
        run: pytest src/02_ml_pipeline/tests -v
