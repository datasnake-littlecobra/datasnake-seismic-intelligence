name: Data Pipeline

# Runs the full bronze -> silver -> gold -> replay pipeline and writes
# classified events into Supabase. Triggers on every push to main and
# on-demand via the Actions tab ("Run workflow").
#
# Bronze/silver now read a small, real, pre-extracted local sample
# (data/stead_sample/, see scripts/extract_stead_sample.py) instead of
# pulling live via SeisBench — SeisBench's own STEAD/Iquique loaders
# require an all-or-nothing multi-GB download with no partial-fetch
# option, confirmed not viable here by an actual CI run that hit an
# 84.9GB download target and timed out. See
# docs/MODULE2_ARCHITECTURE.md's troubleshooting log for the full story.
# This is why push-triggering was disabled for a while and is now back on.
#
# INSTANCE has no local sample extracted yet (only STEAD does) — default
# dataset is "stead" only until that's done; requesting "instance" via
# workflow_dispatch will fail with a clear error, not a silent no-op.
#
# GitHub-hosted runners have normal outbound internet access, unlike the
# dev sandbox this pipeline was originally built in — that's the whole
# reason this runs here instead of requiring a local machine (the
# database write specifically still needs that real network access; the
# bronze/silver/gold stages no longer do, now that they're local-file-based).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dataset:
        description: "Which dataset(s) to run"
        required: false
        default: "stead"
        type: choice
        options: ["stead", "instance", "both"]

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false # never cancel a run mid-write to the database

jobs:
  test:
    uses: ./.github/workflows/test.yml

  run-pipeline:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_POOLER_URL: ${{ secrets.DATABASE_POOLER_URL }}
    strategy:
      matrix:
        dataset: ${{ (github.event.inputs.dataset == 'instance' && fromJSON('["instance"]')) || (github.event.inputs.dataset == 'both' && fromJSON('["stead", "instance"]')) || fromJSON('["stead"]') }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Bronze — read local sample
        run: python src/02_ml_pipeline/bronze_ingest.py --dataset ${{ matrix.dataset }}

      - name: Silver — filter, normalize, window
        run: python src/02_ml_pipeline/silver_clean.py --dataset ${{ matrix.dataset }}

      - name: Gold — label, split
        run: python src/02_ml_pipeline/gold_label_split.py --dataset ${{ matrix.dataset }}

      - name: Replay — classify + upsert into Supabase
        run: python src/02_ml_pipeline/replay_pipeline.py --dataset ${{ matrix.dataset }}

      - name: Upload manifests + gold-layer metadata as build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output-${{ matrix.dataset }}
          path: |
            data/module2_vibration/manifests/
            data/module2_vibration/gold/*.csv
          retention-days: 30
