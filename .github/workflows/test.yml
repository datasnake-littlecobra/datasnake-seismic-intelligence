name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call: {} # lets pipeline.yml depend on this passing before it writes to the database

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-ml.txt

      - name: Install dependencies
        run: pip install -r requirements-ml.txt pytest

      - name: Run pipeline tests
        run: pytest src/02_ml_pipeline/tests -v
