# DataSnake Weather Intelligence — Module 2 (Seismic/Vibration Intelligence) Configuration
# Deliberately a SEPARATE file from config.yaml (which stays untouched) so Module 2
# config changes never risk breaking the existing NOAA/USGS ingestion config.
# Edit values for your environment; secrets go in .env (DATABASE_URL / DATABASE_POOLER_URL).

datasets:
  stead:
    name: "STEAD"
    license: "CC BY 4.0"
    # Not a live SeisBench pull — SeisBench's STEAD loader requires an
    # all-or-nothing ~85GB download with no partial-fetch option (confirmed
    # by an actual CI run hitting that exact download target regardless of
    # sample_size, and by reading SeisBench's own source). This points at a
    # small, real, licensed sample extracted once, locally, by hand, via
    # scripts/extract_stead_sample.py. See data/stead_sample/ and
    # docs/MODULE2_ARCHITECTURE.md's troubleshooting log for the full story.
    source: "data/stead_sample/ (extracted from github.com/smousavi05/STEAD)"
    sample_size: 50   # everything currently extracted — 25 earthquake_local + 25 noise

  instance:
    name: "INSTANCE"
    license: "CC BY 4.0"
    source: "seisbench.data.InstanceCounts"   # SeisBench dataset class name for INSTANCE
    # NOT YET AVAILABLE: no local sample has been extracted for INSTANCE the
    # way STEAD's was — running bronze_ingest.py --dataset instance will
    # fail with a clear FileNotFoundError until that's done (same
    # extraction approach as STEAD, a different source dataset).
    sample_size: 20

model:
  phase_picker: "PhaseNet"          # SeisBench pretrained model for phase-picking
  pretrained_weights: "stead"       # SeisBench pretrained weight set
  window_length_sec: 30
  sampling_rate_hz: 100

  # PhaseNet outputs a per-timestep probability for each of N(oise)/P/S —
  # it's a phase picker, not a purpose-built event classifier. These two
  # thresholds are how replay_pipeline.py's classify_window() turns that
  # into a window-level event_type + a governance decision:
  #   - detection_threshold: minimum peak P or S probability anywhere in
  #     the window to call it "seismic" at all. 0.3 matches SeisBench's
  #     own default pick threshold (_annotate_args["*_threshold"]) rather
  #     than inventing a new number.
  #   - review_threshold: below this confidence (whichever score won),
  #     abstain and set requires_human_review — same idea as any other
  #     under-confident-model guardrail in this project.
  detection_threshold: 0.3
  review_threshold: 0.5

  event_types:
    - seismic
    - vehicle_human   # PhaseNet cannot produce this — no dataset behind
                        # it labels vehicle/human vibration separately.
                        # See gold_label_split.py's docstring and
                        # docs/MODEL_STRATEGY.md.
    - environmental
    - unknown

split:
  train_frac: 0.70
  val_frac: 0.15
  test_frac: 0.15
  group_by: "scenario_family_id"    # split at the family level, never per-record, to prevent leakage
  random_seed: 42

api:
  cors_origins:
    - "https://hyperlocalwatch.com"
  route_prefix: "/events"
  default_page_size: 50

logging:
  level: INFO
  format: "[%(asctime)s] %(levelname)s %(message)s"
  datefmt: "%Y-%m-%d %H:%M:%S"
  file: logs/module2_pipeline.log
